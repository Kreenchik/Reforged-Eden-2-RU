---
# Playfield Configuration
# IMPORTANT: YAML files use spaces as indentation. Please don't use TABs - tab indentation is forbidden: http://yaml.org/faq.html
#Created by Needleship


Description: "[c][e0e020] ПРИМЕЧАНИЕ: в целях безопасности бортовой компьютер не позволит вам войти в атмосферу. [-][/c] \nНе все газовые планеты рождаются гигантами: если при формировании поблизости было мало материала, некоторые остаются довольно маленькими. \nИ все же это огромная масса водорода, окутывающая небольшое каменное ядро. Примеси других газов придают облакам цвет. \n\nЯростные бури в атмосфере могут разорвать любой смелый корабль - а давление на «поверхности» раздавит его. \n- Посадка не рекомендуется.


[c][808080][i]Автор оригинала: Needleship.[/i][-][/c]"


PlanetType: Gas
PlayfieldType: Planet
Difficulty: 2

AllowHV: False                  # Dis-allow HVs to enter/spawn in this playfield, default is True
AllowSV: False                  # Dis-allow SVs to enter/spawn in this playfield, default is True
AllowCV: False                  # Dis-allow CVs to enter/spawn in this playfield, default is True
AllowBA: False                  # Dis-allow BAs to enter/spawn in this playfield, default is True

# Atmosphere and Sky
AtmosphereEnabled: True
# AtmosphereColor: "0.5, 0.53, 0.58"
AtmosphereColor: "0.7, 0.7, 0.8"
SkyColor: "1, 0.8, 1"
SkyHorizonColor: "1, 0.3, 0"

# Light
DayLightIntensity: 0.9
NightLightIntensity: 0.05
DayShadowStrength: 0.95
NightShadowStrength: 0.5

LightZenithColor: "0.80, 0.8, 1"
LightHorizonColor: "1, 0.6, 0.15"
NightLightColor: "0.2, 0.0, 1.0"

# Sun
SunFlare: EnvironmentalEffects/SunFlareWhite

# Fog
AtmosphereFog: 0.1
FogCloudIntensity: 0.0
GroundFogIntensity: 0.00
GroundFogHeight: 0

# Clouds and Wind
CloudsDensity: 0.3
CloudsSharpness: 0.2
CloudsBrightness: 0.6
CloudsZenithColor: "0.4, 0.5, 0.4"
CloudsHorizonColor: "1, 0.3, 0"

WindSpeed: 3

# Special Effects
SpecialEffectsGlobal:
  - Name: Clear
    Type: Weather
    InitialDelay: 0
    Delay: 3
    Lifetime: 1200

# ==============================================================

### Resource Deposits
RandomResources:



### Resource Asteroids
AsteroidResources:


### POIs
POIs:
    Random:

 

### Drones

    FixedPlayerStart:
        - Mode: Debug
          Pos: [ 0, 120, 0 ]
          RotY: 0

        - Mode: Survival
          Spawn: EscapePod
          Armor: ArmorMedium

DroneSpawning:
    Random:
        - DronesMinMax: [ 0, 0 ]
          CenterX: -2500
          Radius: 2000

        - DronesMinMax: [ 0, 0 ]
          CenterX: 2500
          Radius: 2000

# ==============================================================
# ==============================================================

SpawnRateZones:


SpawnZones:

### Creatures
CreatureSpawning:
