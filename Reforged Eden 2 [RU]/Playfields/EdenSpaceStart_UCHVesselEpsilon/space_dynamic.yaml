# Playfield Characteristics
Description: "Здесь стоит [c][FFFFFF]исследовательское судно UCH[-][/c] UCHN Pathfinder, занятое исследованиями или обслуживанием.

Если вы еще этого не сделали, всем выжившим терранам предлагается начать пролог Project Eden, миссию [c][00ffff]Установить связь с силами Терран[-][/c] на вкладке [c][00ff00]Одиночные миссии[-][/c], а затем явиться на ближайшее исследовательское судно UCH.


[c][ffffff][i]Добыча на астероидах, принадлежащих фракции, считается актом войны. Наличие ТИ зависит от территорий фракций в галактике.[/i][-][/c]"

Gravity: 0
AtmosphereEnabled: False
PvPProb: 0
UseFixed: True

# Standard Star
Radiation: [5,10]
TemperatureDay: [-200,-100]
# Music: [moonstone, space, DistantWorlds, Migration, Artefact, ColdDivide] # Orbit
# Music: [Sanctuary, Vanguard, Helios, ColdDivide, AlteredPhase] # POI
Music: [Reaver] # POI


PlayfieldType: Space
LandClaimZone: Device
PlanetType: UCH Research Vessel
PlayfieldLevelOverride: [1,2]

